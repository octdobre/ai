<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E">
  <title>Blog · Fully Prompted</title>
  <meta name="description" content="All blog posts on Fully Prompted, newest first.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/site.css">
  <style>
    .posts { margin-top: 32px; display: flex; flex-direction: column; }
    .post { display: grid; grid-template-columns: 140px 1fr; gap: 4px 24px; padding: 22px 0; border-top: 1px solid var(--border); }
    .post time { color: var(--faint); font-size: 14px; padding-top: 2px; }
    .post .t { font-size: 1.2rem; font-weight: 600; letter-spacing: -0.01em; }
    .post:hover .t { color: #c4b5fd; }
    .post p { grid-column: 2; margin: 0; color: var(--muted); }
    .post .tags { grid-column: 2; display: flex; gap: 6px; margin-top: 6px; }
    .post .tags span { font-size: 12px; color: var(--faint); border: 1px solid var(--border); border-radius: 6px; padding: 1px 8px; }
    .post.newest .t::after { content: "Latest"; margin-left: 10px; vertical-align: 3px; font-size: 11px; font-weight: 600; color: #6ee7b7; border: 1px solid rgba(52, 211, 153, 0.35); background: rgba(52, 211, 153, 0.08); border-radius: 999px; padding: 2px 8px; }
    .no-posts { color: var(--faint); border: 1px dashed var(--border); border-radius: var(--radius); padding: 28px; text-align: center; margin-top: 32px; }
    @media (max-width: 640px) {
      .post { grid-template-columns: 1fr; }
      .post p, .post .tags { grid-column: 1; }
    }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="../index.html"><span class="brand-mark">💬</span> Fully Prompted <span class="byline">– by Octavian Dobre</span></a>
      <nav class="nav-links">
        <a href="../index.html#practice">Practice</a>
        <a href="../index.html#foundations">Foundations</a>
        <a href="../index.html#library">Library</a>
        <a href="index.html">Blog</a>
      </nav>
    </div>
  </header>

  <main>
    <nav class="crumbs" aria-label="Breadcrumb">
      <a href="../index.html">Home</a><span>/</span>
      <span>Blog</span>
    </nav>

    <header class="doc-hero">
      <h1>✍️ <span class="gradient-text">Blog</span></h1>
      <p class="lead">Longer posts on what changed and what worked, newest first.</p>
    </header>

    <div class="posts" id="posts"></div>
  </main>

  <footer>
    <h4>Acknowledgements</h4>
    All content in this repository is fully AI-generated. 🤖✨😄🧪
  </footer>

  <script src="posts.js"></script>
  <script>
    const posts = [...(window.BLOG_POSTS || [])].sort((a, b) => b.date.localeCompare(a.date));
    const fmt = d => new Date(d + 'T00:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    const list = document.getElementById('posts');
    list.innerHTML = posts.length
      ? posts.map((p, i) => `
          <a class="post${i === 0 ? ' newest' : ''}" href="${p.slug}.html">
            <time datetime="${p.date}">${fmt(p.date)}</time>
            <span class="t">${p.title}</span>
            <p>${p.summary}</p>
            ${p.tags && p.tags.length ? `<span class="tags">${p.tags.map(t => `<span>${t}</span>`).join('')}</span>` : ''}
          </a>`).join('')
      : '<div class="no-posts">No posts yet. The first one will appear here.</div>';
  </script>
</body>
</html>
